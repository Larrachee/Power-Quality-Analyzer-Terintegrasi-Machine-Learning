<div class="metric-grid">
    <div class="metric-card">
        <div class="metric-label"><i class="fas fa-charging-station" style="color:#d97706;"></i> Voltage</div>
        <div class="metric-value" id="voltageValue">0.0 <span class="metric-unit">V</span></div>
        <div class="metric-sub">±1.2% <span class="badge-ok"><i class="fas fa-check-circle"></i> stable</span></div>
    </div>
    <div class="metric-card">
        <div class="metric-label"><i class="fas fa-bolt" style="color:#2563eb;"></i> Current</div>
        <div class="metric-value" id="currentValue">0.00 <span class="metric-unit">A</span></div>
        <div class="metric-sub">THD 2.1%</div>
    </div>
    <div class="metric-card">
        <div class="metric-label"><i class="fas fa-chart-line" style="color:#0d9488;"></i> Power</div>
        <div class="metric-value" id="powerValue">0 <span class="metric-unit">W</span></div>
        <div class="metric-sub">PF 0.00</div>
    </div>
    <div class="metric-card">
        <div class="metric-label"><i class="fas fa-file-signature" style="color:#7c3aed;"></i> Energy</div>
        <div class="metric-value" id="energyValue">0.0 <span class="metric-unit">kWh</span></div>
        <div class="metric-sub">today +0.0 kWh</div>
    </div>
    <div class="metric-card">
        <div class="metric-label"><i class="fas fa-wave-square" style="color:#b453b4;"></i> Frequency</div>
        <div class="metric-value" id="frequencyValue">0.00 <span class="metric-unit">Hz</span></div>
        <div class="metric-sub"> <i class="far fa-circle" style="color:#22b455; font-size: 0.5rem;"></i> nominal</div>
    </div>
    <div class="metric-card">
        <div class="metric-label"><i class="fas fa-microchip" style="color:#e11d48;"></i> ML inference</div>
        <div class="metric-value" id="mlInferenceValue" style="font-size:1.8rem;">✔ 98%</div>
        <div class="metric-sub" id="anomalyScoreSub">anomaly score 0.03</div>
    </div>
</div>

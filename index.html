<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Quality · PZEM-004T</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <link rel="stylesheet" href="UI.css">
</head>

<body>
    <div class="dashboard">
        <div id="header-component"></div>
        <div id="metrics-component"></div>
        <div id="chart-component"></div>
        <div id="prediction-component"></div>
        <div id="footer-component"></div>
    </div>

    <script>
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    document.getElementById(elementId).innerHTML = await response.text();
                } else {
                    console.error(`Gagal memuat komponen: ${filePath}`);
                }
            } catch (error) {
                console.error(`Eror saat mengambil file komponen:`, error);
            }
        }

        async function initDashboard() {
            await loadComponent('header-component', 'components/header.html');
            await loadComponent('metrics-component', 'components/metric-cards.html');
            await loadComponent('chart-component', 'components/chart-row.html');
            await loadComponent('prediction-component', 'components/prediction-table.html');
            await loadComponent('footer-component', 'components/footer.html');

            const mainScript = document.createElement('script');
            mainScript.src = 'UI.js';
            document.body.appendChild(mainScript);
        }

        window.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>

</html>

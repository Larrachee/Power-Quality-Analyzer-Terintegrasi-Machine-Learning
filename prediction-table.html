<div class="prediction-wrapper">
    <h3 style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
        <span><i class="fas fa-calendar-week" style="color:#2a7de1;"></i> Rekapitulasi & Grafik Pemakaian
            Mingguan</span>
        <span
            style="font-weight:400; font-size:0.7rem; background: #e0f2fe; color: #0369a1; padding:0.2rem 1rem; border-radius:30px;">
            <i class="fas fa-chart-bar"></i> Weekly Trends
        </span>
    </h3>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Minggu ke-</th>
                    <th>Rentang Tanggal</th>
                    <th>Total Pemakaian</th> <!-- Ganti tulisan 'Rata-rata Daya' di sini -->
                    <th>Grafik Pemakaian (7 Hari)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="weeklyTableBody">
                <!-- Data akan diisi otomatis oleh UI.js -->
            </tbody>
        </table>
    </div>
</div>
